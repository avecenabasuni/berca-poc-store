services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: medusa_postgres
    restart: unless-stopped
    command: >
      postgres
      -c shared_preload_libraries=pg_stat_statements
      -c track_activity_query_size=4096
      -c pg_stat_statements.track=all
    environment:
      POSTGRES_DB: medusa-store
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    labels:
      com.datadoghq.tags.env: "poc"
      com.datadoghq.tags.service: "berca-postgres"
      com.datadoghq.tags.version: "1.0.0"
      com.datadoghq.ad.check_names: '["postgres"]'
      com.datadoghq.ad.init_configs: '[{}]'
      com.datadoghq.ad.instances: '[{
        "dbm": true,
        "host": "%%host%%",
        "port": 5432,
        "username": "datadog",
        "password": "datadog",
        "dbname": "medusa-store",
          "service": "berca-postgres",
        "tags": [
          "dbinstanceidentifier:medusa-postgres-db",
            "service:berca-postgres",
            "env:poc"
        ]
      }]'
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres-init/01-datadog-dbm.sql:/docker-entrypoint-initdb.d/01-datadog-dbm.sql:ro
      - ./load-test:/load-test:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d medusa-store"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - medusa_network

  # PgBouncer Connection Pooler (for 5-Minute Datadog Monitor Saturation POC)
  pgbouncer:
    image: edoburu/pgbouncer:v1.25.2-p0
    container_name: medusa_pgbouncer
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "6432:6432"
    volumes:
      - ./docker/pgbouncer/pgbouncer.ini:/etc/pgbouncer/pgbouncer.ini:ro
      - ./docker/pgbouncer/userlist.txt:/etc/pgbouncer/userlist.txt:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -p 6432 -U postgres -d pgbouncer"]
      interval: 5s
      timeout: 3s
      retries: 20
    labels:
      com.datadoghq.tags.env: "poc"
      com.datadoghq.tags.service: "pgbouncer"
      com.datadoghq.tags.version: "1.0.0"
      com.datadoghq.ad.check_names: '["pgbouncer"]'
      com.datadoghq.ad.init_configs: '[{}]'
      com.datadoghq.ad.instances: '[{
        "host": "%%host%%",
        "port": 6432,
        "username": "datadog",
        "password": "datadog",
        "database_url": "postgresql://datadog:datadog@%%host%%:6432/pgbouncer",
        "tags": ["service:pgbouncer", "env:poc", "resource_id:pgbouncer-demo"]
      }]'
    networks:
      - medusa_network

  # Redis
  redis:
    image: redis:7-alpine
    container_name: medusa_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - medusa_network

  # Medusa Server
  # This service runs the Medusa backend application
  # and the admin dashboard.
  medusa:
    build: .
    container_name: medusa_backend
    restart: unless-stopped
    depends_on:
      - postgres
      - redis
      - pgbouncer
    ports:
      - "9000:9000"
      - "5173:5173"
    environment:
      - NODE_ENV=development
      - DATABASE_URL=postgres://postgres:postgres@pgbouncer:6432/medusa-store
      - REDIS_URL=redis://redis:6379
      - NODE_OPTIONS=--import dd-trace/initialize.mjs
      - DD_AGENT_HOST=datadog-agent
      - DD_TRACE_AGENT_URL=http://datadog-agent:8126
      - DD_TRACE_STARTUP_LOGS=true
      - DD_SERVICE=berca-backend
      - DD_ENV=poc
      - DD_VERSION=1.0.0
      - DD_LOGS_INJECTION=true
      - DD_DBM_PROPAGATION_MODE=full
      - POC_DEMO_MODE=true
      - POC_DISK_IMPACT_MARKER=/var/run/berca-poc/disk-degraded
    env_file:
      - apps/backend/.env
    volumes:
      - .:/server
      - /server/node_modules
      - /server/apps/backend/node_modules
      - ./docker/demo-state:/var/run/berca-poc:ro
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9000/health"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 120s
    networks:
      - medusa_network

  # Storefront
  # This service runs the Next.js Starter Storefront
  storefront:
    build:
      context: .
      dockerfile: Dockerfile.storefront
      args:
        MEDUSA_PUBLIC_URL: ${MEDUSA_PUBLIC_URL:?MEDUSA_PUBLIC_URL must be set}
        STOREFRONT_PUBLIC_URL: ${STOREFRONT_PUBLIC_URL:?STOREFRONT_PUBLIC_URL must be set}
        MEDUSA_PUBLISHABLE_KEY: ${MEDUSA_PUBLISHABLE_KEY:?MEDUSA_PUBLISHABLE_KEY must be set}
    container_name: medusa_storefront
    restart: unless-stopped
    depends_on:
      medusa:
        condition: service_healthy
    ports:
      - "8000:8000"
    environment:
      - NODE_ENV=production
      - MEDUSA_BACKEND_URL_INTERNAL=http://medusa:9000
      - NEXT_PUBLIC_MEDUSA_BACKEND_URL=${MEDUSA_PUBLIC_URL}
      - NEXT_PUBLIC_BASE_URL=${STOREFRONT_PUBLIC_URL}
      - NEXT_PUBLIC_MEDUSA_PUBLISHABLE_KEY=${MEDUSA_PUBLISHABLE_KEY}
      - NEXT_PUBLIC_DEFAULT_REGION=id
      - NODE_OPTIONS=--import dd-trace/initialize.mjs
      - DD_AGENT_HOST=datadog-agent
      - DD_TRACE_AGENT_URL=http://datadog-agent:8126
      - DD_TRACE_STARTUP_LOGS=true
      - DD_SERVICE=berca-storefront
      - DD_ENV=poc
      - DD_VERSION=1.0.0
      - DD_LOGS_INJECTION=true
      - DD_DBM_PROPAGATION_MODE=full
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8000/api/healthz"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 120s
    networks:
      - medusa_network

  # Log Saturation Generator (for Scenario 2 Disk Log Saturation POC)
  log-generator:
    image: alpine:3.22
    container_name: medusa_log_generator
    restart: unless-stopped
    command: ["/bin/sh", "-c", "while true; do /bin/sh /scripts/log-generator.sh; sleep 2; done"]
    volumes:
      - ./docker/log-saturation/data:/var/log/poc-app
      - ./docker/log-saturation/log-generator.sh:/scripts/log-generator.sh:ro
      - ./docker/demo-state:/var/run/berca-poc
    labels:
      com.datadoghq.tags.env: "poc"
      com.datadoghq.tags.service: "berca-backend"
      com.datadoghq.tags.resource_id: "synthetic-log-volume"
    networks:
      - medusa_network

  # Dedicated, opt-in PgBouncer fault generator for the hero demo.
  # It is never started by the default Compose lifecycle.
  pool-hog:
    image: postgres:15-alpine
    container_name: berca_poc_pool_hog
    profiles: ["demo-fault"]
    restart: "no"
    stop_grace_period: 10s
    depends_on:
      pgbouncer:
        condition: service_healthy
    environment:
      PGPASSWORD: postgres
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        exec pgbench
        -h pgbouncer
        -p 6432
        -U postgres
        -c 25
        -j 5
        -T 600
        -n
        -f /load-test/pgbench-saturation.sql
        medusa-store
    volumes:
      - ./load-test:/load-test:ro
    networks:
      - medusa_network

  # Load Test Traffic Generator
  # Runs k6 baseline traffic continuously to build realistic historical data.
  traffic-generator:
    image: grafana/k6:1.0.0
    container_name: medusa_traffic_generator
    restart: unless-stopped
    depends_on:
      medusa:
        condition: service_healthy
      storefront:
        condition: service_healthy
    env_file:
      - apps/storefront/.env
    environment:
      - MEDUSA_BASE_URL=http://medusa:9000
      - STOREFRONT_BASE_URL=http://storefront:8000
      - MEDUSA_PUBLISHABLE_KEY=${MEDUSA_PUBLISHABLE_KEY:-${NEXT_PUBLIC_MEDUSA_PUBLISHABLE_KEY:-}}
    labels:
      com.datadoghq.tags.env: "poc"
      com.datadoghq.tags.service: "berca-traffic-generator"
      com.datadoghq.tags.version: "1.0.0"
    volumes:
      - ./load-test:/scripts
    entrypoint: ["/bin/sh", "/scripts/entrypoint.sh"]
    networks:
      - medusa_network

  # Datadog Agent (Trimmed POC setup for container monitoring, APM, and logs)
  datadog-agent:
    image: registry.datadoghq.com/agent:7
    container_name: dd-agent
    pid: host
    environment:
      - DD_API_KEY=${DD_API_KEY}
      - DD_SITE=${DD_SITE:-datadoghq.com}
      - DD_ENV=poc
      - DD_DOGSTATSD_NON_LOCAL_TRAFFIC=true
      - DD_APM_ENABLED=true
      - DD_APM_NON_LOCAL_TRAFFIC=true
      - DD_APM_RECEIVER_SOCKET=/var/run/datadog/apm.socket
      - DD_DOGSTATSD_SOCKET=/var/run/datadog/dsd.socket
      - DD_LOGS_ENABLED=true
      - DD_LOGS_CONFIG_AUTO_MULTI_LINE_DETECTION=true
      - DD_LOGS_CONFIG_CONTAINER_COLLECT_ALL=true
      - DD_CONTAINER_EXCLUDE_LOGS=name:dd-agent
    healthcheck:
      test: ["CMD", "agent", "health"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 30s
    volumes:
      - /var/run/datadog:/var/run/datadog
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /proc/:/host/proc/:ro
      - /sys/fs/cgroup/:/host/sys/fs/cgroup:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - ./docker/log-saturation/data:/var/log/poc-app:ro
      - ./docker/datadog/conf.d/disk.d/conf.yaml:/etc/datadog-agent/conf.d/disk.d/conf.yaml:ro
      - ./docker/datadog/conf.d/http_check.d/conf.yaml:/etc/datadog-agent/conf.d/http_check.d/conf.yaml:ro
      - ./docker/datadog/conf.d/poc_synthetic_log.d/conf.yaml:/etc/datadog-agent/conf.d/poc_synthetic_log.d/conf.yaml:ro
      - ./docker/datadog/checks.d/poc_synthetic_log.py:/etc/datadog-agent/checks.d/poc_synthetic_log.py:ro
    networks:
      - medusa_network

volumes:
  postgres_data:

networks:
  medusa_network:
    driver: bridge
