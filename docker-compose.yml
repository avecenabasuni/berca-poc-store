services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: medusa_postgres
    restart: unless-stopped
    command: >
      postgres
      -c shared_preload_libraries=pg_stat_statements
      -c track_activity_query_size=4096
      -c pg_stat_statements.track=all
    environment:
      POSTGRES_DB: medusa-store
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    labels:
      com.datadoghq.tags.env: "production"
      com.datadoghq.tags.service: "medusa-postgres"
      com.datadoghq.tags.version: "1.0.0"
      com.datadoghq.ad.check_names: '["postgres"]'
      com.datadoghq.ad.init_configs: '[{}]'
      com.datadoghq.ad.instances: '[{
        "dbm": true,
        "host": "%%host%%",
        "port": 5432,
        "username": "datadog",
        "password": "datadog",
        "dbname": "medusa-store",
        "service": "medusa-postgres",
        "tags": [
          "dbinstanceidentifier:medusa-postgres-db",
          "service:medusa-postgres",
          "env:production"
        ]
      }]'
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres-init/01-datadog-dbm.sql:/docker-entrypoint-initdb.d/01-datadog-dbm.sql:ro
      - ./load-test:/load-test:ro
    networks:
      - medusa_network

  # PgBouncer Connection Pooler (for 5-Minute Datadog Monitor Saturation POC)
  pgbouncer:
    image: edoburu/pgbouncer:latest
    container_name: medusa_pgbouncer
    restart: unless-stopped
    depends_on:
      - postgres
    ports:
      - "6432:6432"
    volumes:
      - ./docker/pgbouncer/pgbouncer.ini:/etc/pgbouncer/pgbouncer.ini:ro
      - ./docker/pgbouncer/userlist.txt:/etc/pgbouncer/userlist.txt:ro
    labels:
      com.datadoghq.tags.env: "production"
      com.datadoghq.tags.service: "pgbouncer"
      com.datadoghq.tags.version: "1.0.0"
      com.datadoghq.ad.check_names: '["pgbouncer"]'
      com.datadoghq.ad.init_configs: '[{}]'
      com.datadoghq.ad.instances: '[{
        "host": "%%host%%",
        "port": 6432,
        "username": "datadog",
        "password": "datadog",
        "database_url": "postgresql://datadog:datadog@%%host%%:6432/pgbouncer",
        "tags": ["service:pgbouncer", "env:production"]
      }]'
    networks:
      - medusa_network

  # Redis
  redis:
    image: redis:7-alpine
    container_name: medusa_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    networks:
      - medusa_network

  # Medusa Server
  # This service runs the Medusa backend application
  # and the admin dashboard.
  medusa:
    build: .
    container_name: medusa_backend
    restart: unless-stopped
    depends_on:
      - postgres
      - redis
      - pgbouncer
    ports:
      - "9000:9000"
      - "5173:5173"
    environment:
      - NODE_ENV=development
      - DATABASE_URL=postgres://postgres:postgres@pgbouncer:6432/medusa-store
      - REDIS_URL=redis://redis:6379
      - NODE_OPTIONS=--import dd-trace/initialize.mjs
      - DD_AGENT_HOST=datadog-agent
      - DD_TRACE_AGENT_URL=http://datadog-agent:8126
      - DD_TRACE_STARTUP_LOGS=true
      - DD_SERVICE=medusa-backend
      - DD_ENV=production
      - DD_VERSION=1.0.0
      - DD_LOGS_INJECTION=true
      - DD_DBM_PROPAGATION_MODE=full
    env_file:
      - apps/backend/.env
    volumes:
      - .:/server
      - /server/node_modules
      - /server/apps/backend/node_modules
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9000/health"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 120s
    networks:
      - medusa_network

  # Storefront
  # This service runs the Next.js Starter Storefront
  storefront:
    build: .
    container_name: medusa_storefront
    restart: unless-stopped
    depends_on:
      - medusa
    ports:
      - "8000:8000"
    environment:
      - NEXT_PUBLIC_MEDUSA_BACKEND_URL=http://medusa:9000
      - NEXT_PUBLIC_DEFAULT_REGION=id
      - NODE_OPTIONS=--import dd-trace/initialize.mjs
      - DD_AGENT_HOST=datadog-agent
      - DD_TRACE_AGENT_URL=http://datadog-agent:8126
      - DD_TRACE_STARTUP_LOGS=true
      - DD_SERVICE=medusa-storefront
      - DD_ENV=production
      - DD_VERSION=1.0.0
      - DD_LOGS_INJECTION=true
      - DD_DBM_PROPAGATION_MODE=full
    env_file:
      - apps/storefront/.env
    volumes:
      - .:/server
      - /server/node_modules
      - /server/apps/backend/node_modules
      - /server/apps/storefront/node_modules
      - /server/apps/storefront/.next
    entrypoint: ["./start-storefront.sh"]
    networks:
      - medusa_network

  # Log Saturation Generator (for Scenario 2 Disk Log Saturation POC)
  log-generator:
    image: alpine:latest
    container_name: medusa_log_generator
    restart: unless-stopped
    command: ["/bin/sh", "-c", "chmod +x /scripts/log-generator.sh && while true; do /scripts/log-generator.sh; sleep 2; done"]
    volumes:
      - ./docker/log-saturation/data:/var/log/poc-app
      - ./docker/log-saturation/log-generator.sh:/scripts/log-generator.sh:ro
    networks:
      - medusa_network

  # Load Test Traffic Generator
  # Runs k6 baseline traffic continuously to build realistic historical data.
  # Spike tests are triggered manually via ./load-test/trigger-spike.sh
  traffic-generator:
    image: grafana/k6:latest
    container_name: medusa_traffic_generator
    restart: unless-stopped
    depends_on:
      medusa:
        condition: service_healthy
    env_file:
      - apps/storefront/.env
    environment:
      - MEDUSA_BASE_URL=http://medusa:9000
      - MEDUSA_PUBLISHABLE_KEY=${MEDUSA_PUBLISHABLE_KEY:-${NEXT_PUBLIC_MEDUSA_PUBLISHABLE_KEY:-}}
    volumes:
      - ./load-test:/scripts
    entrypoint: ["/bin/sh", "/scripts/entrypoint.sh"]
    networks:
      - medusa_network

  # Datadog Agent (Trimmed POC setup for container monitoring, APM, and logs)
  datadog-agent:
    image: registry.datadoghq.com/agent:7
    container_name: dd-agent
    pid: host
    environment:
      - DD_API_KEY=${DD_API_KEY}
      - DD_SITE=${DD_SITE:-datadoghq.com}
      - DD_ENV=production
      - DD_DOGSTATSD_NON_LOCAL_TRAFFIC=true
      - DD_APM_ENABLED=true
      - DD_APM_NON_LOCAL_TRAFFIC=true
      - DD_APM_RECEIVER_SOCKET=/var/run/datadog/apm.socket
      - DD_DOGSTATSD_SOCKET=/var/run/datadog/dsd.socket
      - DD_LOGS_ENABLED=true
      - DD_LOGS_CONFIG_AUTO_MULTI_LINE_DETECTION=true
      - DD_LOGS_CONFIG_CONTAINER_COLLECT_ALL=true
      - DD_CONTAINER_EXCLUDE_LOGS=name:dd-agent
    volumes:
      - /var/run/datadog:/var/run/datadog
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /proc/:/host/proc/:ro
      - /sys/fs/cgroup/:/host/sys/fs/cgroup:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - ./docker/log-saturation/data:/var/log/poc-app:ro
    networks:
      - medusa_network

volumes:
  postgres_data:

networks:
  medusa_network:
    driver: bridge
