[databases]
medusa-store = host=postgres port=5432 dbname=medusa-store auth_user=postgres

[pgbouncer]
listen_addr = *
listen_port = 6432
auth_type = trust
auth_file = /etc/pgbouncer/userlist.txt
admin_users = postgres, datadog
stats_users = datadog, postgres
pool_mode = transaction
default_pool_size = 5
max_db_connections = 5
reserve_pool_size = 0
max_client_conn = 50
query_wait_timeout = 600
ignore_startup_parameters = extra_float_digits, search_path
