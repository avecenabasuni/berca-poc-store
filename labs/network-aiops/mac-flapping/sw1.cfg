set / interface ethernet-1/1 admin-state enable
set / interface ethernet-1/1 vlan-tagging true
set / interface ethernet-1/1 subinterface 1 type bridged
set / interface ethernet-1/1 subinterface 1 admin-state enable
set / interface ethernet-1/1 subinterface 1 vlan encap untagged
set / interface ethernet-1/2 admin-state enable
set / interface ethernet-1/2 vlan-tagging true
set / interface ethernet-1/2 subinterface 1 type bridged
set / interface ethernet-1/2 subinterface 1 admin-state enable
set / interface ethernet-1/2 subinterface 1 vlan encap untagged
set / network-instance mac-flap type mac-vrf
set / network-instance mac-flap admin-state enable
set / network-instance mac-flap interface ethernet-1/1.1
set / network-instance mac-flap interface ethernet-1/2.1
set / network-instance mac-flap bridge-table mac-duplication admin-state enable
set / network-instance mac-flap bridge-table mac-duplication monitoring-window 1
set / network-instance mac-flap bridge-table mac-duplication num-moves 3
set / network-instance mac-flap bridge-table mac-duplication hold-down-time 3
set / network-instance mac-flap bridge-table mac-duplication action stop-learning
