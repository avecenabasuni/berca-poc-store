---
# Group variables for RHEL 9.6 CVE Remediation POC
# These values define the safety boundaries for the automation.
# Every patch job validates against these controls before touching the VM.
#
# AAP loads this file automatically because:
#   - The file is named "rhel96_vuln_poc.yml" inside "group_vars/"
#   - The AAP Inventory has a group named "rhel96_vuln_poc"
#   - AAP syncs group_vars from the Git project on each launch

# -- Target identification ------------------------------------------------- #

cve_poc_environment: "poc"
cve_poc_resource_id: "rhel09-vuln-poc-01"
cve_poc_rhel_major_version: "9"

# -- Severity controls ----------------------------------------------------- #
# Allowed severity levels accepted from Datadog SOAR / Slack approval.

cve_allowed_severities:
  - "critical"
  - "high"
  - "medium"
  - "low"
  - "info"
  - "important"
  - "moderate"

# -- Component to RPM package mapping -------------------------------------- #
# Scanners (e.g. Trivy / Datadog CSM) report vulnerability findings at the
# source component level (e.g. "vim", "curl", "openssl"). This mapping resolves
# the component name to its corresponding binary RPM packages in RHEL 9.
# If a package name is not in this map, it defaults to [package_name].

cve_component_rpm_map:
  vim:
    - "vim-enhanced"
    - "vim-common"
    - "vim-minimal"
    - "vim-filesystem"
  curl:
    - "curl"
    - "libcurl"
  openssl:
    - "openssl"
    - "openssl-libs"
  sudo:
    - "sudo"
  systemd:
    - "systemd"
    - "systemd-libs"
    - "systemd-pam"
    - "systemd-udev"
  glibc:
    - "glibc"
    - "glibc-common"
    - "glibc-all-langpacks"
  openssh:
    - "openssh"
    - "openssh-clients"
    - "openssh-server"
  gnutls:
    - "gnutls"
  libssh:
    - "libssh"
    - "libssh-config"
  libxml2:
    - "libxml2"
    - "python3-libxml2"
  zlib:
    - "zlib"
  python3:
    - "python3"
    - "python3-libs"
  bash:
    - "bash"

# -- Service restart controls ---------------------------------------------- #
# Services that the playbook is allowed to restart after patching.
# Any service reported by `dnf needs-restarting --services` that is in this
# list will be restarted; others will be logged for manual review.

cve_allowed_restart_services:
  - "curl"
  - "openssl"
  - "httpd"
  - "nginx"
  - "sshd"
  - "rsyslog"
  - "systemd-journald"

# -- Reboot controls ------------------------------------------------------- #
# Whether the playbook is allowed to reboot the VM when the advisory
# requires it (e.g. kernel patches).

cve_allow_reboot: false

# -- Datadog callback (optional) ------------------------------------------- #

cve_datadog_callback_enabled: false
cve_datadog_callback_url: ""

# -- Timeouts -------------------------------------------------------------- #

cve_reboot_timeout_seconds: 300
cve_dnf_cache_timeout_seconds: 120
