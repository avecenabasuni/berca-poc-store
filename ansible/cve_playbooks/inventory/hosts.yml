---
# Inventory for RHEL 9.6 Vulnerability Remediation POC
#
# REFERENCE FILE -- The actual inventory is managed in the AAP web UI.
# This file documents the expected structure and can be used for local
# CLI testing outside of AAP.
#
# AAP web UI setup:
#   1. Create Inventory "Ansible Datadog Collab POC VMs"
#   2. Create Group "rhel09-vuln-poc-01" (must match playbook hosts: value)
#   3. Add Host "rhel09-vuln-poc-01" with ansible_host set to 192.168.2.65
#
# IP of rhel09-vuln-poc-01 is 192.168.2.65.
all:
  children:
    rhel09-vuln-poc-01:
      hosts:
        rhel09-vuln-poc-01:
          ansible_host: "192.168.2.65"
          ansible_user: "ansibleap"
          ansible_become: true
          ansible_become_method: sudo
          ansible_python_interpreter: /usr/bin/python3
