---
# Remediation Job Template: hot-add VM memory via Nutanix Prism Central v3 API.
# The desired total RAM is specified via the AAP survey field
# 'memory_target_gib' (integer, GiB). The playbook:
#   1. Fails if the target <= current VM RAM (cannot shrink memory via hot-add)
#   2. Succeeds silently (idempotent) if the VM is already at or above the target
#   3. Checks the Nutanix cluster for enough free memory before patching the VM
#
# Job Template: "Hot Add Application VM Memory"
# Survey fields:
#   memory_target_gib      - Desired total RAM in GiB after hot-add (integer, min 1)
#   monitor_id             - Datadog Monitor ID (audit)
#   investigation_id       - Datadog Investigation ID (audit)
#   workflow_instance_id   - Datadog Workflow Instance ID (audit)
#
# Nutanix credentials come from AAP Credential variables:
#   nutanix_prism_endpoint  (e.g. https://prism.bercalab.my.id:9440)
#   nutanix_vm_uuid         (fixed VM UUID)
#   nutanix_username
#   nutanix_password

- name: Hot Add Application VM Memory
  hosts: berca_poc_vm
  serial: 1
  any_errors_fatal: true
  become: true
  gather_facts: true
  vars:
    poc_action: hot_add_memory
    schema_version: "1.0"
    poc_environment: poc
    poc_service: berca-backend
    poc_classification: MEMORY_PRESSURE
    poc_requested_action: hot_add_memory
    # Nutanix API polling
    poc_nutanix_task_poll_retries: 30
    poc_nutanix_task_poll_delay: 10
    poc_nutanix_guest_ram_poll_retries: 30
    poc_nutanix_guest_ram_poll_delay: 5
    poc_storefront_catalog_probe_url: "http://127.0.0.1:8000/id/store"
  tasks:
    # ------------------------------------------------------------ #
    # Input validation
    # ------------------------------------------------------------ #

    - name: Validate memory_target_gib is provided and is a positive integer
      ansible.builtin.assert:
        that:
          - (memory_target_gib | default(none)) is not none
          - (memory_target_gib | int) >= 1
          - (memory_target_gib | int) <= 512
        fail_msg: >-
          ABORT: 'memory_target_gib' must be a whole number between 1 and 512.
          Got: '{{ memory_target_gib | default("<not provided>") }}'.

    - name: Validate audit IDs from survey
      ansible.builtin.assert:
        that:
          - (monitor_id | default(none)) is string
          - (monitor_id | default('') | length) > 0
          - (monitor_id | default('') | length) <= 128
          - (monitor_id | default('')) is match('^[A-Za-z0-9._:/-]+$')
          - (investigation_id | default(none)) is string
          - (investigation_id | default('') | length) > 0
          - (investigation_id | default('') | length) <= 128
          - (investigation_id | default('')) is match('^[A-Za-z0-9._:/-]+$')
          - (workflow_instance_id | default(none)) is string
          - (workflow_instance_id | default('') | length) > 0
          - (workflow_instance_id | default('') | length) <= 128
          - (workflow_instance_id | default('')) is match('^[A-Za-z0-9._:/-]+$')
        fail_msg: "All audit IDs must be bounded non-empty strings."

    - name: Validate Nutanix credentials are provided
      ansible.builtin.assert:
        that:
          - (nutanix_prism_endpoint | default('') | length) > 0
          - (nutanix_vm_uuid | default('') | length) > 0
          - (nutanix_username | default('') | length) > 0
          - (nutanix_password | default('') | length) > 0
        fail_msg: >-
          ABORT: Nutanix credentials must be provided via AAP
          Inventory/Credential. Required: nutanix_prism_endpoint,
          nutanix_vm_uuid, nutanix_username, nutanix_password.
      no_log: true

    - name: Record execution start time
      ansible.builtin.set_fact:
        _poc_start_time: "{{ now(utc=true) }}"

    - name: Run preflight checks
      ansible.builtin.include_role:
        name: berca_poc_demo
        tasks_from: preflight

    - name: Execute hot-add memory with lock protection
      block:
        - name: Acquire shared operation lock
          ansible.builtin.include_role:
            name: berca_poc_demo
            tasks_from: acquire-lock

        # ------------------------------------------------------------ #
        # Read current VM state (guest OS view)
        # ------------------------------------------------------------ #

        - name: Read memory state
          ansible.builtin.include_role:
            name: berca_poc_demo
            tasks_from: read-memory-state

        - name: Read storefront state
          ansible.builtin.include_role:
            name: berca_poc_demo
            tasks_from: read-storefront-state

        # ------------------------------------------------------------ #
        # Get current VM spec from Nutanix (authoritative for sizing)
        # ------------------------------------------------------------ #

        - name: Get current VM spec from Nutanix
          ansible.builtin.uri:
            url: "{{ nutanix_prism_endpoint }}/api/nutanix/v3/vms/{{ nutanix_vm_uuid }}"
            method: GET
            user: "{{ nutanix_username }}"
            password: "{{ nutanix_password }}"
            force_basic_auth: true
            validate_certs: false
            return_content: true
            status_code: 200
          register: _nutanix_vm_get
          delegate_to: localhost
          become: false
          no_log: true

        - name: Extract current VM memory and spec metadata from Nutanix
          ansible.builtin.set_fact:
            _nutanix_current_memory_mib: "{{ _nutanix_vm_get.json.spec.resources.memory_size_mib | int }}"
            _nutanix_spec_version: "{{ _nutanix_vm_get.json.metadata.spec_version }}"
            _nutanix_vm_spec: "{{ _nutanix_vm_get.json.spec }}"
            _nutanix_vm_metadata: "{{ _nutanix_vm_get.json.metadata }}"

        # ------------------------------------------------------------ #
        # Compute delta and validate direction of change
        # ------------------------------------------------------------ #

        - name: Convert target to MiB and compute delta
          ansible.builtin.set_fact:
            _memory_target_mib: "{{ (memory_target_gib | int) * 1024 }}"
            _memory_before_mib: "{{ _nutanix_current_memory_mib }}"
            _memory_add_mib: >-
              {{ ((memory_target_gib | int) * 1024) - (_nutanix_current_memory_mib | int) }}

        - name: Display planned memory change
          ansible.builtin.debug:
            msg: >
              Planning hot-add:
              current={{ _nutanix_current_memory_mib }} MiB
              ({{ (_nutanix_current_memory_mib | int // 1024) }} GiB)
              => target={{ _memory_target_mib }} MiB
              ({{ memory_target_gib }} GiB),
              delta={{ _memory_add_mib }} MiB

        - name: Fail if target RAM is less than current VM RAM (cannot shrink via hot-add)
          ansible.builtin.assert:
            that:
              - (_memory_target_mib | int) >= (_nutanix_current_memory_mib | int)
            fail_msg: >-
              ABORT: Requested target ({{ memory_target_gib }} GiB /
              {{ _memory_target_mib }} MiB) is less than the VM's current RAM
              ({{ (_nutanix_current_memory_mib | int // 1024) }} GiB /
              {{ _nutanix_current_memory_mib }} MiB).
              Memory hot-add can only increase RAM. To shrink, use the Restore
              playbook instead.

        # ------------------------------------------------------------ #
        # Idempotent check: already at or above target
        # ------------------------------------------------------------ #

        - name: Handle VM already at target memory (idempotent)
          when: (_memory_target_mib | int) == (_nutanix_current_memory_mib | int)
          block:
            - name: Publish idempotent hot-add evidence
              ansible.builtin.set_stats:
                data:
                  poc_hot_add_changed: false
                  poc_memory_current_gib: "{{ (_nutanix_current_memory_mib | int // 1024) }}"
                  poc_memory_target_gib: "{{ memory_target_gib }}"

            - name: Release lock before ending idempotent hot-add
              ansible.builtin.include_role:
                name: berca_poc_demo
                tasks_from: release-lock

            - name: End host after idempotent hot-add
              ansible.builtin.meta: end_host

        # ------------------------------------------------------------ #
        # Pre-flight assertions (guest-side)
        # ------------------------------------------------------------ #

        - name: Assert memory pressure is active
          ansible.builtin.assert:
            that:
              - poc_memory_pressure_active | bool
            fail_msg: >-
              ABORT: Memory pressure container is not active.
              Hot-add remediation must happen while pressure is running.

        - name: Assert application services are still observable
          ansible.builtin.assert:
            that:
              - poc_storefront_healthy | bool
              - poc_traefik_healthy | bool
            fail_msg: "ABORT: Storefront or Traefik is not healthy."

        # ------------------------------------------------------------ #
        # Nutanix cluster capacity check (via hosts/list)
        # ------------------------------------------------------------ #

        - name: Query all Nutanix hosts to aggregate free memory
          ansible.builtin.uri:
            url: "{{ nutanix_prism_endpoint }}/api/nutanix/v3/hosts/list"
            method: POST
            user: "{{ nutanix_username }}"
            password: "{{ nutanix_password }}"
            force_basic_auth: true
            validate_certs: false
            body: '{"kind": "host", "length": 100}'
            body_format: json
            return_content: true
            status_code: 200
          register: _nutanix_hosts
          delegate_to: localhost
          become: false
          no_log: true

        - name: Initialise cluster memory accumulators
          ansible.builtin.set_fact:
            _cluster_memory_capacity_mib: 0
            _cluster_memory_usage_mib: 0

        - name: Accumulate capacity and usage across all hosts
          ansible.builtin.set_fact:
            _cluster_memory_capacity_mib: >-
              {{ (_cluster_memory_capacity_mib | int)
                 + (item.status.resources.memory_capacity_mib | default(0) | int) }}
            _cluster_memory_usage_mib: >-
              {{ (_cluster_memory_usage_mib | int)
                 + (((item.status.resources.memory_capacity_mib | default(0) | int)
                     * (item.status.resources.hypervisor.memory_usage_ppm | default(0) | int))
                    // 1000000) }}
          loop: "{{ _nutanix_hosts.json.entities }}"
          loop_control:
            label: "{{ item.status.name | default('host') }}"

        - name: Compute cluster free memory
          ansible.builtin.set_fact:
            _cluster_free_mib: >-
              {{ (_cluster_memory_capacity_mib | int) - (_cluster_memory_usage_mib | int) }}

        - name: Display cluster memory capacity summary
          ansible.builtin.debug:
            msg: >
              Nutanix cluster memory (from {{ _nutanix_hosts.json.metadata.total_matches | default('?') }} host(s)) —
              capacity: {{ _cluster_memory_capacity_mib }} MiB
              ({{ (_cluster_memory_capacity_mib | int // 1024) }} GiB),
              used: {{ _cluster_memory_usage_mib }} MiB,
              free: {{ _cluster_free_mib }} MiB
              ({{ (_cluster_free_mib | int // 1024) }} GiB).
              Requested delta: {{ _memory_add_mib }} MiB ({{ memory_to_add_gib }} GiB).

        - name: Assert cluster has enough free memory for the requested hot-add
          ansible.builtin.assert:
            that:
              - (_cluster_free_mib | int) >= (_memory_add_mib | int)
            fail_msg: >-
              ABORT: Nutanix cluster does not have enough free memory to satisfy
              this request.
              Requested: {{ _memory_add_mib }} MiB ({{ memory_to_add_gib }} GiB).
              Cluster free: {{ _cluster_free_mib }} MiB
              ({{ (_cluster_free_mib | int // 1024) }} GiB).
              Cluster capacity: {{ _cluster_memory_capacity_mib }} MiB,
              cluster used: {{ _cluster_memory_usage_mib }} MiB.
              Reduce the requested amount or free cluster resources first.

        # ------------------------------------------------------------ #
        # Nutanix Prism Central v3 API -- update VM memory
        # ------------------------------------------------------------ #

        - name: Build updated VM spec with target memory
          ansible.builtin.set_fact:
            _nutanix_update_body:
              spec: "{{ _nutanix_vm_spec | combine({'resources': _nutanix_vm_spec.resources | combine({'memory_size_mib': _memory_target_mib | int})}) }}"
              metadata: "{{ _nutanix_vm_metadata | combine({'spec_version': _nutanix_spec_version | int}) }}"

        - name: Update VM memory via Nutanix Prism Central API
          ansible.builtin.uri:
            url: "{{ nutanix_prism_endpoint }}/api/nutanix/v3/vms/{{ nutanix_vm_uuid }}"
            method: PUT
            user: "{{ nutanix_username }}"
            password: "{{ nutanix_password }}"
            force_basic_auth: true
            validate_certs: false
            body: "{{ _nutanix_update_body }}"
            body_format: json
            return_content: true
            status_code: [200, 202]
          register: _nutanix_vm_update
          delegate_to: localhost
          become: false
          no_log: true

        - name: Extract Nutanix task UUID
          ansible.builtin.set_fact:
            _nutanix_task_uuid: "{{ _nutanix_vm_update.json.status.execution_context.task_uuid | default(_nutanix_vm_update.json.status.state | default('unknown')) }}"

        - name: Display Nutanix task UUID
          ansible.builtin.debug:
            msg: "Nutanix update task UUID: {{ _nutanix_task_uuid }}"

        # ------------------------------------------------------------ #
        # Poll Nutanix task until completion
        # ------------------------------------------------------------ #

        - name: Poll Nutanix task until complete
          ansible.builtin.uri:
            url: "{{ nutanix_prism_endpoint }}/api/nutanix/v3/tasks/{{ _nutanix_task_uuid }}"
            method: GET
            user: "{{ nutanix_username }}"
            password: "{{ nutanix_password }}"
            force_basic_auth: true
            validate_certs: false
            return_content: true
            status_code: 200
          register: _nutanix_task_poll
          until: (_nutanix_task_poll.json.status | default('')) in ['SUCCEEDED', 'FAILED']
          retries: "{{ poc_nutanix_task_poll_retries }}"
          delay: "{{ poc_nutanix_task_poll_delay }}"
          delegate_to: localhost
          become: false
          no_log: true

        - name: Assert Nutanix task succeeded
          ansible.builtin.assert:
            that:
              - _nutanix_task_poll.json.status == 'SUCCEEDED'
            fail_msg: >-
              ABORT: Nutanix memory update task failed.
              Task UUID: {{ _nutanix_task_uuid }},
              Status: {{ _nutanix_task_poll.json.status | default('unknown') }}

        # ------------------------------------------------------------ #
        # Wait for guest OS to see updated RAM
        # ------------------------------------------------------------ #

        - name: Compute minimum expected guest memory in KiB (target - 1 GiB tolerance)
          ansible.builtin.set_fact:
            _guest_ram_min_kib: "{{ ((_memory_target_mib | int) - 1024) * 1024 }}"

        - name: Wait for guest OS to report at least target memory
          ansible.builtin.command:
            argv:
              - awk
              - "/^MemTotal:/ {print $2}"
              - /proc/meminfo
          register: _guest_ram_poll
          changed_when: false
          until: (_guest_ram_poll.stdout | trim | int) >= (_guest_ram_min_kib | int)
          retries: "{{ poc_nutanix_guest_ram_poll_retries }}"
          delay: "{{ poc_nutanix_guest_ram_poll_delay }}"

        # ------------------------------------------------------------ #
        # Post-hot-add verification
        # ------------------------------------------------------------ #

        - name: Read final memory state
          ansible.builtin.include_role:
            name: berca_poc_demo
            tasks_from: read-memory-state

        - name: Assert VM guest reports at least target memory
          ansible.builtin.assert:
            that:
              - (poc_memory_total_gib | float) >= ((_memory_target_mib | int) / 1024 - 1) | float
            fail_msg: >-
              Hot-add verification failed: guest reports
              {{ poc_memory_total_gib }} GiB,
              expected at least {{ ((_memory_target_mib | int) / 1024 - 1) | round(1) }} GiB.

        - name: Assert memory pressure is still active
          ansible.builtin.assert:
            that:
              - poc_memory_pressure_active | bool
            fail_msg: "Memory pressure container stopped unexpectedly during hot-add."

        - name: Read final storefront state
          ansible.builtin.include_role:
            name: berca_poc_demo
            tasks_from: read-storefront-state

        - name: Assert application is still healthy
          ansible.builtin.assert:
            that:
              - poc_storefront_healthy | bool
              - poc_traefik_healthy | bool
            fail_msg: "Application health check failed after hot-add."

        - name: Publish hot-add evidence
          ansible.builtin.set_stats:
            data:
              poc_hot_add_changed: true
              poc_memory_before_mib: "{{ _memory_before_mib }}"
              poc_memory_before_gib: "{{ (_memory_before_mib | int // 1024) }}"
              poc_memory_added_gib: "{{ (_memory_add_mib | int // 1024) }}"
              poc_memory_target_gib: "{{ memory_target_gib }}"
              poc_memory_target_mib: "{{ _memory_target_mib }}"
              poc_memory_after_gib: "{{ poc_memory_total_gib }}"
              poc_memory_pressure_active: "{{ poc_memory_pressure_active }}"
              nutanix_task_uuid: "{{ _nutanix_task_uuid }}"
              poc_storefront_healthy: "{{ poc_storefront_healthy }}"
              cluster_free_before_mib: "{{ _cluster_free_mib }}"
      always:
        - name: Release shared operation lock
          ansible.builtin.include_role:
            name: berca_poc_demo
            tasks_from: release-lock

        - name: Publish execution evidence
          ansible.builtin.set_stats:
            data:
              poc_action: "{{ poc_action }}"
              poc_classification: "{{ poc_classification }}"
              poc_start_time: "{{ _poc_start_time }}"
              poc_end_time: "{{ now(utc=true) }}"
              monitor_id: "{{ monitor_id }}"
              investigation_id: "{{ investigation_id }}"
              workflow_instance_id: "{{ workflow_instance_id }}"
