---
# Reset Job Template: stop memory pressure, restore VM RAM to 16 GiB
# via Nutanix Prism Central v3 API (Power Off -> Resize -> Power On),
# then verify baseline health.
#
# Job Template: "Restore Application VM Memory Baseline"
# No survey -- presenter one-button reset.
#
# Nutanix credentials come from AAP Inventory/Credential variables:
#   nutanix_prism_endpoint  (e.g. https://prism.bercalab.my.id:9440)
#   nutanix_vm_uuid         (fixed VM UUID)
#   nutanix_username
#   nutanix_password

- name: Restore Application VM Memory Baseline
  hosts: berca_poc_vm
  serial: 1
  any_errors_fatal: true
  become: true
  gather_facts: true
  vars:
    poc_action: restore_memory_baseline
    # Memory scenario defaults (duplicated from berca_poc_demo for AAP scope)
    poc_memory_baseline_mib: 16384
    poc_memory_target_mib: 24576
    poc_memory_baseline_tolerance_min_gib: 15
    poc_memory_baseline_tolerance_max_gib: 17
    poc_memory_target_tolerance_min_gib: 23
    poc_memory_target_tolerance_max_gib: 25
    # Nutanix API polling
    poc_nutanix_task_poll_retries: 30
    poc_nutanix_task_poll_delay: 10
    poc_nutanix_power_poll_retries: 30
    poc_nutanix_power_poll_delay: 5
    poc_nutanix_guest_ram_poll_retries: 30
    poc_nutanix_guest_ram_poll_delay: 5
  tasks:
    - name: Validate Nutanix credentials are provided
      ansible.builtin.assert:
        that:
          - (nutanix_prism_endpoint | default('') | length) > 0
          - (nutanix_vm_uuid | default('') | length) > 0
          - (nutanix_username | default('') | length) > 0
          - (nutanix_password | default('') | length) > 0
        fail_msg: >-
          ABORT: Nutanix credentials must be provided via AAP
          Inventory/Credential. Required: nutanix_prism_endpoint,
          nutanix_vm_uuid, nutanix_username, nutanix_password.
      no_log: true

    - name: Record execution start time
      ansible.builtin.set_fact:
        _poc_start_time: "{{ now(utc=true) }}"

    - name: Run preflight checks
      ansible.builtin.include_role:
        name: berca_poc_demo
        tasks_from: preflight

    - name: Execute memory baseline restore with lock protection
      block:
        - name: Acquire shared operation lock
          ansible.builtin.include_role:
            name: berca_poc_demo
            tasks_from: acquire-lock

        # ------------------------------------------------------------ #
        # Read current state
        # ------------------------------------------------------------ #

        - name: Read memory state
          ansible.builtin.include_role:
            name: berca_poc_demo
            tasks_from: read-memory-state

        # ------------------------------------------------------------ #
        # Idempotent check -- already at baseline
        # ------------------------------------------------------------ #

        - name: Handle VM already at baseline 16 GiB
          when: poc_memory_profile == 'baseline_16g'
          block:
            - name: Verify pressure is not active at baseline
              ansible.builtin.assert:
                that:
                  - not (poc_memory_pressure_active | bool)
                fail_msg: >-
                  VM is at baseline 16 GiB but memory pressure is still active.
                  Stop pressure before restoring baseline, or use the canonical
                  reset which handles both.

            - name: Publish idempotent restore evidence
              ansible.builtin.set_stats:
                data:
                  poc_restore_changed: false
                  poc_memory_profile: "{{ poc_memory_profile }}"
                  poc_memory_total_gib: "{{ poc_memory_total_gib }}"

            - name: Release lock before ending idempotent restore
              ansible.builtin.include_role:
                name: berca_poc_demo
                tasks_from: release-lock

            - name: End host after idempotent restore
              ansible.builtin.meta: end_host

        # ------------------------------------------------------------ #
        # Pre-flight assertions
        # ------------------------------------------------------------ #

        - name: Assert VM is at target 24 GiB (not unexpected)
          ansible.builtin.assert:
            that:
              - poc_memory_profile == 'target_24g'
            fail_msg: >-
              ABORT: VM memory profile is '{{ poc_memory_profile }}'
              ({{ poc_memory_total_gib }} GiB). Restore only operates
              from target_24g to baseline_16g. Unexpected profiles
              require manual intervention.

        - name: Assert memory pressure is NOT active
          ansible.builtin.assert:
            that:
              - not (poc_memory_pressure_active | bool)
            fail_msg: >-
              ABORT: Memory pressure container is still active.
              Stop pressure first before restoring baseline.
              Run the canonical reset or stop-memory separately.

        - name: Store pre-restore memory state
          ansible.builtin.set_fact:
            _memory_before_gib: "{{ poc_memory_total_gib }}"

        # ------------------------------------------------------------ #
        # Step 1: Power Off VM via Nutanix Prism Central v3 API
        # ------------------------------------------------------------ #

        - name: Get current VM spec before power off
          ansible.builtin.uri:
            url: "{{ nutanix_prism_endpoint }}/api/nutanix/v3/vms/{{ nutanix_vm_uuid }}"
            method: GET
            user: "{{ nutanix_username }}"
            password: "{{ nutanix_password }}"
            force_basic_auth: true
            validate_certs: false
            return_content: true
            status_code: 200
          register: _nutanix_vm_get_pre_off
          no_log: true

        - name: Request VM power off via Nutanix Prism Central API
          ansible.builtin.uri:
            url: "{{ nutanix_prism_endpoint }}/api/nutanix/v3/vms/{{ nutanix_vm_uuid }}"
            method: PUT
            user: "{{ nutanix_username }}"
            password: "{{ nutanix_password }}"
            force_basic_auth: true
            validate_certs: false
            body:
              spec: "{{ _nutanix_vm_get_pre_off.json.spec | combine({'resources': _nutanix_vm_get_pre_off.json.spec.resources | combine({'power_state': 'OFF'})}) }}"
              metadata: "{{ _nutanix_vm_get_pre_off.json.metadata | combine({'spec_version': _nutanix_vm_get_pre_off.json.metadata.spec_version | int}) }}"
            body_format: json
            return_content: true
            status_code: [200, 202]
          register: _nutanix_vm_off_update
          no_log: true

        - name: Poll power off task until complete
          ansible.builtin.uri:
            url: "{{ nutanix_prism_endpoint }}/api/nutanix/v3/tasks/{{ _nutanix_vm_off_update.json.status.execution_context.task_uuid }}"
            method: GET
            user: "{{ nutanix_username }}"
            password: "{{ nutanix_password }}"
            force_basic_auth: true
            validate_certs: false
            return_content: true
            status_code: 200
          register: _nutanix_off_task_poll
          until: (_nutanix_off_task_poll.json.status | default('')) in ['SUCCEEDED', 'FAILED']
          retries: "{{ poc_nutanix_task_poll_retries }}"
          delay: "{{ poc_nutanix_task_poll_delay }}"
          no_log: true
          when: _nutanix_vm_off_update.json.status.execution_context.task_uuid is defined

        - name: Wait until VM power_state is OFF
          ansible.builtin.uri:
            url: "{{ nutanix_prism_endpoint }}/api/nutanix/v3/vms/{{ nutanix_vm_uuid }}"
            method: GET
            user: "{{ nutanix_username }}"
            password: "{{ nutanix_password }}"
            force_basic_auth: true
            validate_certs: false
            return_content: true
            status_code: 200
          register: _nutanix_vm_state_poll
          until: (_nutanix_vm_state_poll.json.status.resources.power_state | default('')) == 'OFF'
          retries: "{{ poc_nutanix_power_poll_retries }}"
          delay: "{{ poc_nutanix_power_poll_delay }}"
          no_log: true

        # ------------------------------------------------------------ #
        # Step 2: Update VM Memory to 16 GiB while OFF
        # ------------------------------------------------------------ #

        - name: Get current VM spec while powered off
          ansible.builtin.uri:
            url: "{{ nutanix_prism_endpoint }}/api/nutanix/v3/vms/{{ nutanix_vm_uuid }}"
            method: GET
            user: "{{ nutanix_username }}"
            password: "{{ nutanix_password }}"
            force_basic_auth: true
            validate_certs: false
            return_content: true
            status_code: 200
          register: _nutanix_vm_get_off
          no_log: true

        - name: Update VM memory to baseline (16 GiB) while powered off
          ansible.builtin.uri:
            url: "{{ nutanix_prism_endpoint }}/api/nutanix/v3/vms/{{ nutanix_vm_uuid }}"
            method: PUT
            user: "{{ nutanix_username }}"
            password: "{{ nutanix_password }}"
            force_basic_auth: true
            validate_certs: false
            body:
              spec: "{{ _nutanix_vm_get_off.json.spec | combine({'resources': _nutanix_vm_get_off.json.spec.resources | combine({'memory_size_mib': poc_memory_baseline_mib | int})}) }}"
              metadata: "{{ _nutanix_vm_get_off.json.metadata | combine({'spec_version': _nutanix_vm_get_off.json.metadata.spec_version | int}) }}"
            body_format: json
            return_content: true
            status_code: [200, 202]
          register: _nutanix_vm_mem_update
          no_log: true

        - name: Extract Nutanix memory resize task UUID
          ansible.builtin.set_fact:
            _nutanix_task_uuid: "{{ _nutanix_vm_mem_update.json.status.execution_context.task_uuid | default('direct_apply') }}"

        - name: Poll memory update task until complete
          ansible.builtin.uri:
            url: "{{ nutanix_prism_endpoint }}/api/nutanix/v3/tasks/{{ _nutanix_task_uuid }}"
            method: GET
            user: "{{ nutanix_username }}"
            password: "{{ nutanix_password }}"
            force_basic_auth: true
            validate_certs: false
            return_content: true
            status_code: 200
          register: _nutanix_mem_task_poll
          until: (_nutanix_mem_task_poll.json.status | default('')) in ['SUCCEEDED', 'FAILED']
          retries: "{{ poc_nutanix_task_poll_retries }}"
          delay: "{{ poc_nutanix_task_poll_delay }}"
          no_log: true
          when: _nutanix_task_uuid != 'direct_apply'

        - name: Assert memory update task succeeded
          ansible.builtin.assert:
            that:
              - _nutanix_mem_task_poll.json.status == 'SUCCEEDED'
            fail_msg: >-
              ABORT: Nutanix memory restore task failed.
              Task UUID: {{ _nutanix_task_uuid }},
              Status: {{ _nutanix_mem_task_poll.json.status | default('unknown') }}
          when: _nutanix_task_uuid != 'direct_apply'

        # ------------------------------------------------------------ #
        # Step 3: Power On VM via Nutanix Prism Central v3 API
        # ------------------------------------------------------------ #

        - name: Get current VM spec before powering on
          ansible.builtin.uri:
            url: "{{ nutanix_prism_endpoint }}/api/nutanix/v3/vms/{{ nutanix_vm_uuid }}"
            method: GET
            user: "{{ nutanix_username }}"
            password: "{{ nutanix_password }}"
            force_basic_auth: true
            validate_certs: false
            return_content: true
            status_code: 200
          register: _nutanix_vm_get_pre_on
          no_log: true

        - name: Power on VM via Nutanix Prism Central API
          ansible.builtin.uri:
            url: "{{ nutanix_prism_endpoint }}/api/nutanix/v3/vms/{{ nutanix_vm_uuid }}"
            method: PUT
            user: "{{ nutanix_username }}"
            password: "{{ nutanix_password }}"
            force_basic_auth: true
            validate_certs: false
            body:
              spec: "{{ _nutanix_vm_get_pre_on.json.spec | combine({'resources': _nutanix_vm_get_pre_on.json.spec.resources | combine({'power_state': 'ON'})}) }}"
              metadata: "{{ _nutanix_vm_get_pre_on.json.metadata | combine({'spec_version': _nutanix_vm_get_pre_on.json.metadata.spec_version | int}) }}"
            body_format: json
            return_content: true
            status_code: [200, 202]
          register: _nutanix_vm_on_update
          no_log: true

        - name: Poll power on task until complete
          ansible.builtin.uri:
            url: "{{ nutanix_prism_endpoint }}/api/nutanix/v3/tasks/{{ _nutanix_vm_on_update.json.status.execution_context.task_uuid }}"
            method: GET
            user: "{{ nutanix_username }}"
            password: "{{ nutanix_password }}"
            force_basic_auth: true
            validate_certs: false
            return_content: true
            status_code: 200
          register: _nutanix_on_task_poll
          until: (_nutanix_on_task_poll.json.status | default('')) in ['SUCCEEDED', 'FAILED']
          retries: "{{ poc_nutanix_task_poll_retries }}"
          delay: "{{ poc_nutanix_task_poll_delay }}"
          no_log: true
          when: _nutanix_vm_on_update.json.status.execution_context.task_uuid is defined

        # ------------------------------------------------------------ #
        # Step 4: Wait for VM and SSH to come back online
        # ------------------------------------------------------------ #

        - name: Wait for VM to finish booting and accept SSH connections
          ansible.builtin.wait_for_connection:
            delay: 15
            timeout: 300

        # ------------------------------------------------------------ #
        # Step 5: Verify in-guest memory and full stack health
        # ------------------------------------------------------------ #

        - name: Ensure baseline Docker Compose services are running
          ansible.builtin.command:
            argv:
              - docker
              - compose
              - up
              - -d
            chdir: "{{ poc_project_path }}"
          changed_when: false

        - name: Wait for guest to report baseline memory
          ansible.builtin.command:
            argv:
              - awk
              - "/^MemTotal:/ {print $2}"
              - /proc/meminfo
          register: _guest_ram_poll
          changed_when: false
          until: >-
            ((_guest_ram_poll.stdout | trim | int) / 1048576) | round(0) | int
            >= (poc_memory_baseline_tolerance_min_gib | int)
            and
            ((_guest_ram_poll.stdout | trim | int) / 1048576) | round(0) | int
            <= (poc_memory_baseline_tolerance_max_gib | int)
          retries: "{{ poc_nutanix_guest_ram_poll_retries }}"
          delay: "{{ poc_nutanix_guest_ram_poll_delay }}"

        - name: Read final memory state
          ansible.builtin.include_role:
            name: berca_poc_demo
            tasks_from: read-memory-state

        - name: Assert VM is at baseline 16 GiB profile
          ansible.builtin.assert:
            that:
              - poc_memory_profile == 'baseline_16g'
            fail_msg: >-
              Restore verification failed: guest reports {{ poc_memory_total_gib }} GiB
              (profile: {{ poc_memory_profile }}), expected baseline_16g.

        - name: Check Datadog Agent is running
          ansible.builtin.systemd:
            name: datadog-agent
          register: _dd_agent_post
          failed_when: false

        - name: Display Datadog Agent status
          ansible.builtin.debug:
            msg: "Datadog Agent: {{ _dd_agent_post.status.ActiveState | default('unknown') }}"

        - name: Read final storefront state
          ansible.builtin.include_role:
            name: berca_poc_demo
            tasks_from: read-storefront-state

        - name: Assert application stack is healthy
          ansible.builtin.assert:
            that:
              - poc_storefront_healthy | bool
              - poc_traefik_healthy | bool
            fail_msg: "Application health check failed after memory restore."

        - name: Verify storefront HTTP response
          ansible.builtin.uri:
            url: "{{ poc_storefront_catalog_probe_url }}"
            method: GET
            status_code: 200
            timeout: 10
          register: _storefront_http
          failed_when: false

        - name: Display storefront HTTP check result
          ansible.builtin.debug:
            msg: "Storefront HTTP check: {{ _storefront_http.status | default('failed') }}"

        - name: Publish restore evidence
          ansible.builtin.set_stats:
            data:
              poc_restore_changed: true
              poc_memory_before_gib: "{{ _memory_before_gib }}"
              poc_memory_after_gib: "{{ poc_memory_total_gib }}"
              poc_memory_profile: "{{ poc_memory_profile }}"
              nutanix_task_uuid: "{{ _nutanix_task_uuid }}"
              poc_storefront_healthy: "{{ poc_storefront_healthy }}"
              poc_datadog_agent_active: "{{ _dd_agent_post.status.ActiveState | default('unknown') == 'active' }}"
              poc_storefront_http_status: "{{ _storefront_http.status | default('failed') }}"
      always:
        - name: Release shared operation lock
          ansible.builtin.include_role:
            name: berca_poc_demo
            tasks_from: release-lock

        - name: Publish execution evidence
          ansible.builtin.set_stats:
            data:
              poc_action: "{{ poc_action }}"
              poc_start_time: "{{ _poc_start_time }}"
              poc_end_time: "{{ now(utc=true) }}"
