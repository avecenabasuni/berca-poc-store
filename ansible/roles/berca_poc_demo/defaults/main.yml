---
# Project paths (override from inventory/group/host vars)
poc_project_path: ""
poc_state_dir: "{{ poc_project_path }}/docker/demo-state"
poc_log_dir: "{{ poc_project_path }}/docker/log-saturation/data"

# Disk fault configuration
poc_disk_image: /tmp/poc-log-disk.img
poc_disk_image_size_mb: 200
poc_disk_trigger: "{{ poc_log_dir }}/.trigger_saturation"
poc_disk_log: "{{ poc_log_dir }}/app-saturation.log"
poc_impact_marker: "{{ poc_state_dir }}/disk-degraded"

# PgBouncer configuration
poc_pgbouncer_target_db: medusa-store
poc_pgbouncer_target_user: postgres
poc_baseline_pool_size: 5
poc_baseline_max_connections: 5

# Container names
poc_pool_hog_container: berca_poc_pool_hog
poc_storefront_spike_container: berca_poc_storefront_spike

# Storefront autoscale configuration (set the rate in protected inventory)
poc_autoscale_spike_rate: 0
poc_storefront_baseline_replicas: 1
poc_storefront_scaleout_replicas: 2

# Storefront deployment rollback configuration
poc_storefront_release_config_file: /etc/berca-poc/storefront-release.env
poc_storefront_release_image_prefix: "ghcr.io/avecenabasuni/berca-storefront@sha256:"
poc_storefront_catalog_probe_url: http://127.0.0.1:8000/id/store

# Disk recovery threshold
poc_safe_disk_usage_pct: 20

# Shared lock
poc_lock_dir: /run/lock/berca-poc-demo

# Polling bounds
poc_wait_retries: 30
poc_wait_delay: 2
poc_disk_wait_retries: 90
poc_disk_wait_delay: 2
poc_storefront_wait_retries: 60
poc_storefront_wait_delay: 2

# Stale lock threshold (seconds)
poc_lock_stale_seconds: 600

# Memory pressure scenario
poc_memory_pressure_container: berca_poc_memory_pressure
poc_memory_baseline_mib: 16384
poc_memory_target_mib: 24576
poc_memory_baseline_tolerance_min_gib: 15
poc_memory_baseline_tolerance_max_gib: 17
poc_memory_target_tolerance_min_gib: 23
poc_memory_target_tolerance_max_gib: 25
poc_memory_min_available_mib: 2560

