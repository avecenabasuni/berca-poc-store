---
# Roll back only the configured demo-bad storefront to the immutable stable digest.

- name: Verify other fault scenarios are inactive
  ansible.builtin.include_tasks: read-scenario-conflicts.yml

- name: Read approved storefront release configuration
  ansible.builtin.include_tasks: read-storefront-release-config.yml

- name: Read storefront state before rollback
  ansible.builtin.include_tasks: read-storefront-state.yml

- name: Classify current storefront release
  ansible.builtin.set_fact:
    poc_storefront_release_state: >-
      {{ 'stable' if poc_storefront_image == poc_storefront_stable_image
         else 'demo_bad' if poc_storefront_image == poc_storefront_bad_image
         else 'unknown' }}

- name: Record rollback before-state
  ansible.builtin.set_fact:
    _rollback_before:
      release_state: "{{ poc_storefront_release_state }}"
      image: "{{ poc_storefront_image }}"
      version: "{{ poc_storefront_version }}"
      replicas: "{{ poc_storefront_replica_count }}"
      healthy: "{{ poc_storefront_healthy }}"

- name: Handle already-stable release
  when: poc_storefront_release_state == 'stable'
  block:
    - name: Wait for stable storefront catalog
      ansible.builtin.uri:
        url: "{{ poc_storefront_catalog_probe_url }}"
        method: GET
        status_code:
          - 200
          - 503
        timeout: 10
      register: _rollback_existing_catalog
      failed_when: false
      until: (_rollback_existing_catalog.status | default(0) | int) == 200
      retries: "{{ poc_wait_retries }}"
      delay: "{{ poc_wait_delay }}"

    - name: Verify idempotent stable state
      ansible.builtin.assert:
        that:
          - poc_storefront_version == poc_storefront_stable_version
          - poc_storefront_release_mode == 'stable'
          - (poc_storefront_replica_count | int) == 1
          - poc_storefront_healthy | bool
          - poc_traefik_healthy | bool
          - not (poc_autoscale_spike_active | bool)
        fail_msg: "Stable image is present, but the expected healthy baseline is invalid."

    - name: Publish idempotent rollback evidence
      ansible.builtin.set_stats:
        data:
          poc_rollback_before: "{{ _rollback_before }}"
          poc_rollback_after: "{{ _rollback_before }}"
          poc_rollback_changed: false

    - name: Release lock before ending idempotent rollback
      ansible.builtin.include_tasks: release-lock.yml

    - name: End host after idempotent rollback
      ansible.builtin.meta: end_host

- name: Verify approved rollback preconditions
  ansible.builtin.assert:
    that:
      - poc_storefront_release_state == 'demo_bad'
      - poc_storefront_version == poc_storefront_bad_version
      - poc_storefront_release_mode == 'demo-bad'
      - (poc_storefront_container_count | int) == 1
      - poc_traefik_healthy | bool
      - not (poc_autoscale_spike_active | bool)
    fail_msg: >-
      Rollback is allowed only from the approved demo-bad digest with one
      storefront container, healthy Traefik, and no capacity spike.

- name: Roll back to fixed stable release
  ansible.builtin.include_tasks: reconcile-storefront.yml
  vars:
    _storefront_target_image: "{{ poc_storefront_stable_image }}"
    _storefront_target_version: "{{ poc_storefront_stable_version }}"
    _storefront_target_mode: stable
    _storefront_target_replicas: 1
    _storefront_force_recreate: true

- name: Wait for stable storefront catalog recovery
  ansible.builtin.uri:
    url: "{{ poc_storefront_catalog_probe_url }}"
    method: GET
    status_code:
      - 200
      - 503
    timeout: 10
  register: _rollback_recovery_catalog
  failed_when: false
  until: (_rollback_recovery_catalog.status | default(0) | int) == 200
  retries: "{{ poc_wait_retries }}"
  delay: "{{ poc_wait_delay }}"

- name: Verify rollback final state
  ansible.builtin.assert:
    that:
      - poc_storefront_image == poc_storefront_stable_image
      - poc_storefront_version == poc_storefront_stable_version
      - poc_storefront_release_mode == 'stable'
      - (poc_storefront_replica_count | int) == 1
      - poc_storefront_healthy | bool
      - poc_traefik_healthy | bool
      - (_rollback_recovery_catalog.status | int) == 200
    fail_msg: "Storefront rollback did not reach the approved stable release."

- name: Publish rollback remediation evidence
  ansible.builtin.set_stats:
    data:
      poc_rollback_before: "{{ _rollback_before }}"
      poc_rollback_after:
        release_state: stable
        image: "{{ poc_storefront_image }}"
        version: "{{ poc_storefront_version }}"
        replicas: "{{ poc_storefront_replica_count }}"
        healthy: "{{ poc_storefront_healthy }}"
        catalog_status: "{{ _rollback_recovery_catalog.status }}"
      poc_rollback_changed: true
