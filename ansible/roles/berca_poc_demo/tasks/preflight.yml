---
# Preflight checks run before any state-changing task.

- name: Verify poc_project_path is set
  ansible.builtin.assert:
    that:
      - poc_project_path | length > 0
    fail_msg: "poc_project_path must be set in inventory variables"
    quiet: true

- name: Verify project directory exists
  ansible.builtin.stat:
    path: "{{ poc_project_path }}"
  register: _preflight_project_dir

- name: Assert project directory is present
  ansible.builtin.assert:
    that:
      - _preflight_project_dir.stat.exists
      - _preflight_project_dir.stat.isdir
    fail_msg: "Project directory {{ poc_project_path }} does not exist or is not a directory"

- name: Verify docker-compose.yml exists
  ansible.builtin.stat:
    path: "{{ poc_project_path }}/docker-compose.yml"
  register: _preflight_compose_file

- name: Assert docker-compose.yml is present
  ansible.builtin.assert:
    that:
      - _preflight_compose_file.stat.exists
    fail_msg: "docker-compose.yml not found in {{ poc_project_path }}"

- name: Verify Docker Compose v2 is available
  ansible.builtin.command:
    argv:
      - docker
      - compose
      - version
  changed_when: false

- name: Verify Docker daemon is operational
  ansible.builtin.command:
    argv:
      - docker
      - info
  changed_when: false

- name: Validate Docker Compose configuration
  ansible.builtin.command:
    argv:
      - docker
      - compose
      - config
      - --quiet
    chdir: "{{ poc_project_path }}"
  changed_when: false

- name: Read complete Docker Compose service catalog
  ansible.builtin.command:
    argv:
      - docker
      - compose
      - --profile
      - demo-fault
      - --profile
      - autoscale-demo
      - config
      - --services
    chdir: "{{ poc_project_path }}"
  register: _preflight_compose_services
  changed_when: false

- name: Verify required Docker Compose services exist
  ansible.builtin.assert:
    that:
      - item in _preflight_compose_services.stdout_lines
    fail_msg: "Required Compose service '{{ item }}' is missing."
  loop:
    - postgres
    - pgbouncer
    - pool-hog
    - traefik
    - storefront
    - traffic-spike
