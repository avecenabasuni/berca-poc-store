# ansible/roles/closed_loop_remediation/tasks/remediate_disk.yml
---
- name: Execute Disk Log Volume Remediation
  block:
    - name: Remove Saturation Trigger File
      ansible.builtin.file:
        path: "{{ trigger_file_path }}"
        state: absent

    - name: Truncate Application Saturation Log File
      ansible.builtin.shell:
        cmd: "> '{{ log_file_path }}'"
      register: truncate_result
      changed_when: true

    - name: Flush Filesystem Buffers (sync)
      ansible.builtin.command:
        cmd: sync
      changed_when: false

    - name: Poll Disk Usage until usage is under 10%
      ansible.builtin.shell:
        cmd: "df -P '{{ log_dir_path }}' | tail -1 | awk '{print $5}' | tr -d '%'"
      register: disk_pct_poll
      until:
        - (disk_pct_poll.stdout | default('100') | trim | int) <= target_disk_max_pct
      retries: "{{ poll_retries }}"
      delay: "{{ poll_delay }}"
      changed_when: false

    - name: Record Disk Remediation Success
      ansible.builtin.set_fact:
        disk_remediation_success: true
        disk_remediation_error: ""
        final_disk_usage_pct: "{{ disk_pct_poll.stdout | trim }}"

  rescue:
    - name: Record Disk Remediation Failure
      ansible.builtin.set_fact:
        disk_remediation_success: false
        disk_remediation_error: "Disk remediation failed: {{ ansible_failed_result.msg | default('Unknown error during disk truncation') }}"
        final_disk_usage_pct: "{{ disk_pct_poll.stdout | default('unknown') | trim }}"
