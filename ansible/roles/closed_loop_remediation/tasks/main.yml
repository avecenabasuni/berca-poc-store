# ansible/roles/closed_loop_remediation/tasks/main.yml
---
- name: Run Closed-Loop Remediation Preflight Validation
  ansible.builtin.include_tasks: preflight.yml

- name: Run Database Pool Remediation Task
  ansible.builtin.include_tasks: remediate_pool.yml

- name: Run Disk Log Saturation Remediation Task
  ansible.builtin.include_tasks: remediate_disk.yml

- name: Collect Remediation Evidence & Assert Success
  ansible.builtin.include_tasks: collect_evidence.yml
