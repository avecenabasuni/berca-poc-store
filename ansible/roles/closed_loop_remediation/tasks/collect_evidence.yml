# ansible/roles/closed_loop_remediation/tasks/collect_evidence.yml
---
- name: Query Final PgBouncer Pool Status
  ansible.builtin.command:
    cmd: >-
      docker compose exec -T postgres psql -h {{ pgbouncer_host }} -p {{ pgbouncer_port }}
      -U {{ pgbouncer_admin_user }} {{ pgbouncer_db }} -tA -F '|' -c "SHOW CONFIG;"
  args:
    chdir: "{{ docker_project_path }}"
  register: final_config_query
  changed_when: false
  failed_when: false

- name: Query Final PgBouncer Waiting Clients
  ansible.builtin.command:
    cmd: >-
      docker compose exec -T postgres psql -h {{ pgbouncer_host }} -p {{ pgbouncer_port }}
      -U {{ pgbouncer_admin_user }} {{ pgbouncer_db }} -tA -F '|' -c "SHOW POOLS;"
  args:
    chdir: "{{ docker_project_path }}"
  register: final_pools_query
  changed_when: false
  failed_when: false

- name: Extract Final Pool Metrics
  ansible.builtin.set_fact:
    final_pool_size: >-
      {{ (final_config_query.stdout_lines | default([]))
         | select('match', '^default_pool_size\\|')
         | map('split', '|')
         | map('attribute', 1)
         | first | default('unknown') | trim }}
    final_max_conn: >-
      {{ (final_config_query.stdout_lines | default([]))
         | select('match', '^max_db_connections\\|')
         | map('split', '|')
         | map('attribute', 1)
         | first | default('unknown') | trim }}
    final_cl_waiting: >-
      {{ (final_pools_query.stdout_lines | default([]))
         | select('match', '^' ~ pgbouncer_target_db ~ '\\|')
         | map('split', '|')
         | map('attribute', 4)
         | first | default('unknown') | trim }}

- name: Query Final Disk Usage Percentage
  ansible.builtin.shell:
    cmd: "df -P '{{ log_dir_path }}' | tail -1 | awk '{print $5}' | tr -d '%'"
  register: final_disk_query
  changed_when: false
  failed_when: false

- name: Display Executive Closed-Loop Remediation Evidence Summary
  ansible.builtin.debug:
    msg:
      - "=========================================================================="
      - "  CLOSED-LOOP AUTOMATED REMEDIATION EVIDENCE REPORT"
      - "=========================================================================="
      - "  Incident Metadata:"
      - "    Incident ID:         {{ incident_id }}"
      - "    Monitor ID:          {{ monitor_id }}"
      - "    Alert Status:        {{ alert_status }}"
      - "    Environment:         {{ environment }}"
      - "    Requested Action:    {{ requested_action }}"
      - "--------------------------------------------------------------------------"
      - "  Remediation Execution Results:"
      - "    Pool Remediation:    {{ 'SUCCESS' if (pool_remediation_success | default(false)) else 'FAILED' }}"
      - "    Disk Remediation:    {{ 'SUCCESS' if (disk_remediation_success | default(false)) else 'FAILED' }}"
      - "--------------------------------------------------------------------------"
      - "  Final Environment State:"
      - "    PgBouncer Pool Size: {{ final_pool_size }} (Target: {{ target_pool_size }})"
      - "    PgBouncer Max Conn:  {{ final_max_conn }} (Target: {{ target_max_connections }})"
      - "    PgBouncer cl_waiting:{{ final_cl_waiting }} (Target: 0)"
      - "    Disk Usage Pct:      {{ final_disk_query.stdout | default('unknown') | trim }}% (Target: <{{ target_disk_max_pct }}%)"
      - "=========================================================================="

- name: Assert Overall Remediation Success
  ansible.builtin.assert:
    that:
      - pool_remediation_success | default(false)
      - disk_remediation_success | default(false)
    fail_msg: >-
      Closed-Loop Remediation did not meet all success criteria!
      Pool Error: {{ pool_remediation_error | default('None') }} |
      Disk Error: {{ disk_remediation_error | default('None') }}
    success_msg: "Closed-Loop Remediation completed with 100% success verification."
