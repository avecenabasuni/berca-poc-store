# ansible/roles/closed_loop_remediation/tasks/preflight.yml
---
- name: Validate Controller Webhook Payload Metadata
  ansible.builtin.assert:
    that:
      - alert_status == 'ALERT'
      - environment == 'poc'
      - requested_action == 'expand_pool_and_truncate_log'
    fail_msg: >-
      Payload validation failed! Received alert_status='{{ alert_status }}',
      environment='{{ environment }}', requested_action='{{ requested_action }}'.
      Payload must match alert_status='ALERT', environment='poc', and requested_action='expand_pool_and_truncate_log'.
    success_msg: "Controller payload metadata validated successfully."

- name: Check POC Project Directory Existence
  ansible.builtin.stat:
    path: "{{ docker_project_path }}"
  register: project_dir_stat

- name: Assert Project Directory Exists
  ansible.builtin.assert:
    that:
      - project_dir_stat.stat.exists
      - project_dir_stat.stat.isdir
    fail_msg: "POC project directory '{{ docker_project_path }}' does not exist!"

- name: Query PgBouncer Configuration (SHOW CONFIG)
  ansible.builtin.command:
    cmd: >-
      docker compose exec -T postgres psql -h {{ pgbouncer_host }} -p {{ pgbouncer_port }}
      -U {{ pgbouncer_admin_user }} {{ pgbouncer_db }} -tA -F '|' -c "SHOW CONFIG;"
  args:
    chdir: "{{ docker_project_path }}"
  register: pgbouncer_show_config
  changed_when: false
  failed_when: false

- name: Parse PgBouncer Changeable Status
  ansible.builtin.set_fact:
    pool_size_changeable: >-
      {{ (pgbouncer_show_config.stdout_lines | default([]))
         | select('match', '^default_pool_size\\|')
         | map('split', '|')
         | map('attribute', 3)
         | first | default('no') | trim }}
    max_conn_changeable: >-
      {{ (pgbouncer_show_config.stdout_lines | default([]))
         | select('match', '^max_db_connections\\|')
         | map('split', '|')
         | map('attribute', 3)
         | first | default('no') | trim }}

- name: Set Pool Remediation Supported Fact
  ansible.builtin.set_fact:
    pool_remediation_supported: "{{ (pool_size_changeable == 'yes') and (max_conn_changeable == 'yes') }}"

- name: Log PgBouncer Preflight Compatibility Status
  ansible.builtin.debug:
    msg:
      - "PgBouncer SHOW CONFIG query success: {{ pgbouncer_show_config.rc == 0 }}"
      - "default_pool_size changeable: {{ pool_size_changeable }}"
      - "max_db_connections changeable: {{ max_conn_changeable }}"
      - "Pool Remediation Supported: {{ pool_remediation_supported }}"

- name: Warn if PgBouncer parameters are not changeable at runtime
  ansible.builtin.debug:
    msg: "[WARNING] PgBouncer parameters are NOT changeable at runtime! Pool remediation will be marked failed, but disk remediation will proceed."
  when: not pool_remediation_supported
